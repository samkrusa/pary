name: uptime

on:
  schedule:
    # каждые 15 минут
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check sites
        id: check
        run: |
          fail=0
          for url in "https://samkrusa.github.io/pary/"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "ERR")
            echo "$url -> $code"
            echo "| $url | $code |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          if [ "$fail" = "1" ]; then
            echo "::error::Один из сайтов недоступен"
          fi

      - name: Report
        if: always()
        uses: actions/github-script@v7
        env:
          FAIL: ${{ steps.check.outputs.fail }}
        with:
          script: |
            const fail = process.env.FAIL === "1";
            const label = "uptime";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (fail && open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Сайт недоступен",
                body: `Проверка не прошла.\n\nЛог: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: [label],
                assignees: [context.repo.owner],
              });
            }

            if (!fail && open.data.length > 0) {
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: "Сайт снова доступен.",
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                });
              }
            }
